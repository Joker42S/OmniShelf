[project]
name = "omnishelf"
version = "0.1.0-alpha"
description = "OmniShelf：本地优先的个人收藏管理系统（图书 / 漫画 / 影视 / 音乐 / 游戏）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "sqlmodel>=0.0.22",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "typer>=0.12",
    "python-ulid>=3.0",
]

[project.scripts]
omnishelf = "omnishelf.cli:main"

[project.optional-dependencies]
# pip 兼容入口：pip install -e '.[dev]'。
# 内容与下面的 [dependency-groups] 保持一致（后者是 uv / PEP 735 用的）。
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "mypy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnishelf"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:omnishelf.*",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/omnishelf", "tests"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = false
plugins = []

[[tool.mypy.overrides]]
module = ["ulid.*"]
ignore_missing_imports = true
