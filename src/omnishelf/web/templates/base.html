<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OmniShelf{% endblock %}</title>
  <link rel="stylesheet" href="/static/vendor/pico.min.css?v={{ asset_version }}">
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
  <script src="/static/vendor/htmx.min.js?v={{ asset_version }}"></script>
</head>
<body>
<header class="container">
  <nav>
    <ul>
      <li><strong><a href="/" class="contrast">OmniShelf</a></strong></li>
    </ul>
    <ul>
      <li><a href="/">列表</a></li>
      <li><a href="/upload">上传</a></li>
      <li>
        <a href="/review">待复核{% if stats and stats.pending_merges %} <span class="badge">{{ stats.pending_merges }}</span>{% endif %}</a>
      </li>
      <li><a href="/plugins">插件</a></li>
      <li><a href="/logs">日志</a></li>
      <li><a href="/api/docs">API</a></li>
    </ul>
  </nav>
</header>
<main class="container">
  {% block content %}{% endblock %}
</main>
<footer class="container">
  <small>本地优先 · 数据存在你自己的设备上 · <a href="/api/stats">统计</a></small>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
