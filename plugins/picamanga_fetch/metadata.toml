# 每个插件一个目录，这个文件是「说明书」+ 加载入口声明。
[plugin]
id = "picamanga_fetch"
title = "哔咔收藏夹抓取"
version = "1.0.0"
description = "同步哔咔（picacomic）自己收藏夹里的漫画（增量/全量），抓成可直接导入的 JSON，并用内置 importer picamanga 直接入库"
author = "OmniShelf"
entry = "plugin.py"
# query：查库里有多少条漫画、确认 importer 在不在
# import：同步完直接入库（走和上传页/CLI 完全一样的链路）
# 抓取本身在插件目录里自带的 picamanga 包里，不需要宿主给 net 接口。
requires = ["query", "import"]
