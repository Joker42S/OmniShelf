# 每个插件一个目录，这个文件是「说明书」+ 加载入口声明。
[plugin]
id = "music_import"
title = "本地音乐导入"
version = "1.0.0"
description = "用系统选择框挑本地文件夹或多个音乐文件，读标签生成清单后直接入库"
author = "OmniShelf"
entry = "plugin.py"
# audio：读本地音乐文件标签（宿主的 scan_audio / audio_suffixes）
# import：清单写完交给宿主的 music_files importer 入库
# 两条都够用了：不查库、不写库，所以不声明 query。
requires = ["audio", "import"]
